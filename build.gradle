// ── Annotimpler root build script ─────────────────────────────────────────────
// This file only wires the plugins applied to every project and delegates all
// other configuration to focused scripts under gradle/. Each subproject's own
// build.gradle (in its module directory) holds only what is specific to that
// module: its description, jar name and its inter-module dependencies.
//
//   gradle/versions.gradle                 - dependency/tool versions (as ext properties)
//   gradle/repositories.gradle             - repositories shared by every project
//   gradle/subprojects.gradle              - plugin application + convention wiring for subprojects
//   gradle/subproject-dependencies.gradle  - dependencies common to every subproject
//   gradle/delombok.gradle                 - delombok task + Javadoc source preparation
//   gradle/compile-and-test.gradle         - javac/test configuration
//   gradle/code-quality.gradle             - Checkstyle/PMD/SpotBugs configuration
//   gradle/packaging-and-publishing.gradle - jar/sources/javadoc artifacts + publishing
//   gradle/project-task-ordering.gradle    - automatic cross-module task ordering
//   gradle/aggregate-html-report.gradle    - HTML report helper used by aggregate tasks
//   gradle/aggregate-reports.gradle        - aggregate test/coverage/PMD/SpotBugs/Checkstyle tasks
//   gradle/all-javadoc.gradle              - unified multi-module Javadoc task
//   gradle/full-build.gradle               - the "fullBuild" lifecycle task
plugins {
    id("com.github.spotbugs") version "6.5.8"
    id("java-library")
    id("maven-publish")
    id("checkstyle")
    id("signing")
    id("jacoco")
    id("pmd")
    id("project-report")
    id("test-report-aggregation")
    id("jacoco-report-aggregation")
}

allprojects {
    group = "ninja.javahacker.annotimpler"
    version = "1.0.0-2026.08.30"
}

// Exposed so gradle/code-quality.gradle (applied as a separate script, without direct
// compile-time visibility of SpotBugs plugin classes) can reference these types.
ext {
    spotBugsTaskType   = com.github.spotbugs.snom.SpotBugsTask
    spotBugsEffort     = com.github.spotbugs.snom.Effort
    spotBugsConfidence = com.github.spotbugs.snom.Confidence
}

apply(from: "gradle/versions.gradle")
apply(from: "gradle/repositories.gradle")
apply(from: "gradle/subprojects.gradle")
apply(from: "gradle/aggregate-html-report.gradle")
apply(from: "gradle/all-javadoc.gradle")
apply(from: "gradle/aggregate-reports.gradle")
apply(from: "gradle/full-build.gradle")
